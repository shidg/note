apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-runner-register
  namespace: gitlab-private
spec:
  template:
    spec:
      serviceAccountName: gitlab-runner
      containers:
        - name: register
          image: harbor.baway.org.cn/gitlab/gitlab-runner:v17.10.0
          command:
            - gitlab-runner
            - register
            - --non-interactive
            - --url
            - http://git.baway.org.cn
            - --registration-token
            - your_git.baway.org.cn
            - --executor
            - kubernetes
            - --kubernetes-namespace
            - gitlab-runner
            - --description
            - "k8s-runner"
            - --kubernetes-image
            - python:3.11
            - --tag-list
            - mkdocs
            - --run-untagged=true
            - --locked=false
      restartPolicy: Never

