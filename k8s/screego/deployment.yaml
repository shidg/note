---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: screego
  name: screego
  namespace: private
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screego
  template:
    metadata:
      labels:
        app: screego
    spec:
      containers:
      - name: screegi
        image: harbor.baway.org.cn/library/screego:1.11.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5050
          name: tcp-5050 
        - containerPort: 3478
          name: tcp-3478 
        env:
        - name: SCREEGO_EXTERNAL_IP
          value: "dns:screego.baway.org.cn@10.203.43.8:53" 
---
apiVersion: v1
kind: Service
metadata:
  name: screego
  namespace: private
spec:
  ports:
  - port: 3478
    targetPort: 3478
    name: http-3478
    protocol: TCP
  - port: 5050
    targetPort: 5050
    protocol: TCP
    name: http-5050
  selector:
    app: screego
  type: ClusterIP
