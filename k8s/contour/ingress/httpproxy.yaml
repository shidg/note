apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: ngx-httpproxy
spec:
  ingressClassName: contour    
  virtualhost:
    fqdn: ngx.cc
    tls:
      secretName: my-tls
  routes:
  - conditions:               
    - prefix: /            
    services:                 
    - name: ngx-svc
      port: 8008
