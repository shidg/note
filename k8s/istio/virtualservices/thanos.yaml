apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: thanos-querier
  namespace: istio-system
spec:
  hosts:
  - thanos.baway.org.cn
  gateways:
    - baway-gateway-http
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 9090
        host: thanos-querier.istio-system.svc.cluster.local
