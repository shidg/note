apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: consul
  namespace: istio-system
spec:
  hosts:
  - consul.baway.org.cn
  gateways:
    - baway-gateway-http
  http:
  - match:
    - uri:
        prefix: / 
    route:
    - destination:
        port:
          number: 8500
        host: consul-consul-server.consul.svc.cluster.local
